name: Trigger Other Workflows

on:
  schedule:
    - cron: '*/5 * * * *'  # Every 5 minutes for testupdater
    - cron: '0 * * * *'    # 9 minutes past every hour for autoupdate
  
  workflow_dispatch:

jobs:
  trigger-test:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger testupdater workflow
        run: |
          curl -X POST \
            -H "Authorization: token ${{ secrets.GITHUB_TOKEN }}" \
            -H "Accept: application/vnd.github.v3+json" \
            -H "Content-Type: application/json" \
            -d '{"event_type":"trigger-testupdater"}' \
            https://api.github.com/repos/Marotzu/osu-track-refresher/dispatches

  trigger-auto:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger autoupdate workflow
        run: |
          curl -X POST \
            -H "Authorization: token ${{ secrets.GITHUB_TOKEN }}" \
            -H "Accept: application/vnd.github.v3+json" \
            -H "Content-Type: application/json" \
            -d '{"event_type":"trigger-autoupdate"}' \
            https://api.github.com/repos/Marotzu/osu-track-refresher/dispatches
