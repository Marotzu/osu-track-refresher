name: Trigger Scheduled Updates

on:
  schedule:
    - cron: '*/5 * * * *'  # Every 5 minutes for testing

jobs:
  trigger:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger test updater workflow
        run: |
          curl -X POST \
            -H "Authorization: token ${{ secrets.GITHUB_TOKEN }}" \
            -H "Accept: application/vnd.github.v3+json" \
            https://api.github.com/repos/${{ github.repository }}/actions/workflows/testupdater.yml/dispatches \
            -d '{"ref":"main"}'
