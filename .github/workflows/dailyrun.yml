name: osu!track Automated Update

on:
  # Schedule the workflow to run at a specific time.
  # This example runs every hour.
  # For more info on cron syntax: https://crontab.guru/
  schedule:
    - cron: '0 * * * *'
  
  # Allows you to run this workflow manually from the Actions tab in GitHub
  workflow_dispatch:

jobs:
  run_osu_track_update:
    runs-on: ubuntu-latest # Specify the operating system for the job

    steps:
    - name: Checkout repository # Step to get your code from the repository
      uses: actions/checkout@v4

    - name: Set up Python # Step to set up the Python environment
      uses: actions/setup-python@v5
      with:
        python-version: '3.9' # You can specify your preferred Python version (e.g., '3.10', '3.11')

    - name: Install dependencies # Step to install any required Python packages
      run: |
        python -m pip install --upgrade pip
        pip install requests # Install the requests library

    - name: Run osu!track update script # Step to execute your Python script
      run: python osu_track_updater.py # The actual name of your Python file
