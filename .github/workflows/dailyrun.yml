name: Run Daily osu Track Refresher

on:
  schedule:
    # Runs automatically every single day at 6:00 AM UTC
    - cron: '0 6 * * *'
  # This enables a manual "Run" button in the GitHub dashboard
  workflow_dispatch:

jobs:
  run-script:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install requests

    - name: Execute Python script
      run: python script.py
